<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSA Visualiser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>DSA Visualiser</h1>

    <label class="algo">
      Algorithm
      <select id="algo">
        <option value="bubble">Bubble Sort</option>
        <option value="insertion">Insertion Sort</option>
        <option value="selection">Selection Sort</option>
        <option value="merge">Merge Sort</option>
        <option value="quick">Quick Sort</option>
      </select>
    </label>

    <span id="status-text">Ready.</span>
  </header>

  <div id="toolbar">
    <label class="input-row">
      Input
      <input id="input-array" type="text"
             placeholder="e.g. 5, 2, 8, 1, 9, 3, 7, 4, 6"
             autocomplete="off" spellcheck="false" />
    </label>
    <button id="btn-apply"  type="button">Apply</button>
    <button id="btn-random" type="button">Random</button>
    <span id="input-error" role="alert"></span>
  </div>

  <main>
    <!-- Single rendering surface. Every algorithm draws here via drawArray() etc. -->
    <canvas id="stage" width="1200" height="600"></canvas>
  </main>

  <footer id="controls">
    <button id="btn-reset" type="button">Reset</button>
    <button id="btn-step-back" type="button">Step Back</button>
    <button id="btn-play" type="button">Play</button>
    <button id="btn-pause" type="button" disabled>Pause</button>
    <button id="btn-step-forward" type="button">Step Forward</button>

    <label class="speed">
      Speed
      <input id="speed" type="range" min="1" max="60" value="6" />
      <span id="speed-value">6 fps</span>
    </label>

    <span id="frame-counter">frame 0 / 0</span>
  </footer>

  <script src="algorithms/bubble.js"></script>
  <script src="algorithms/insertion.js"></script>
  <script src="algorithms/selection.js"></script>
  <script src="algorithms/merge.js"></script>
  <script src="algorithms/quick.js"></script>
  <script src="script.js"></script>
</body>
</html>
