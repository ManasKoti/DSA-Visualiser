<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSA Visualiser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Header ── -->
  <header>
    <div class="header-brand">
      <div class="header-logo">⬡</div>
      <h1>DSA Visualiser</h1>
    </div>

    <div class="header-sep"></div>

    <label class="algo">
      Kind
      <select id="kind">
        <option value="sort">Sorting</option>
        <option value="search">Searching</option>
        <option value="structure">Structures</option>
      </select>
    </label>

    <label class="algo">
      Algorithm
      <select id="algo"></select>
    </label>

    <span id="status-text">Ready.</span>
  </header>

  <!-- ── Input toolbar ── -->
  <div id="toolbar">
    <label class="input-row">
      Input
      <input id="input-array" type="text"
             placeholder="e.g. 5, 2, 8, 1, 9, 3, 7, 4, 6"
             autocomplete="off" spellcheck="false" />
    </label>
    <label class="input-row target-row" id="target-row" hidden>
      Target
      <input id="input-target" type="text"
             placeholder="e.g. 7"
             autocomplete="off" spellcheck="false" />
    </label>
    <button id="btn-apply"  type="button">Apply</button>
    <button id="btn-random" type="button">⚄&thinsp;Random</button>
    <span id="input-error" role="alert"></span>
  </div>

  <!-- ── Operations toolbar (structures only; hidden for sort/search) ── -->
  <div id="ops-row" hidden>
    <label class="input-row ops-value-row">
      Value
      <input id="ops-value" type="text"
             placeholder="e.g. 7"
             autocomplete="off" spellcheck="false" />
    </label>
    <div id="ops-buttons" class="ctrl-group"></div>
  </div>

  <!-- ── Canvas ── -->
  <main>
    <!-- Single rendering surface — all algorithms draw here via drawArray(). -->
    <canvas id="stage" width="1200" height="600"></canvas>
  </main>

  <!-- ── Colour legend (populated by renderLegend() in script.js) ── -->
  <div id="legend" aria-label="Colour legend"></div>

  <!-- ── Playback controls ── -->
  <footer id="controls">
    <div class="ctrl-group">
      <button id="btn-reset"        type="button" title="Reset (R)">↩ Reset</button>
      <button id="btn-step-back"    type="button" title="Step back (←)">◀ Back</button>
      <button id="btn-play"         type="button" title="Play (Space)">▶ Play</button>
      <button id="btn-pause"        type="button" title="Pause (Space)" disabled>⏸ Pause</button>
      <button id="btn-step-forward" type="button" title="Step forward (→)">Next ▶</button>
    </div>

    <div class="ctrl-sep"></div>

    <label class="speed">
      Speed
      <input id="speed" type="range" min="1" max="60" value="6" />
      <span id="speed-value">6 fps</span>
    </label>

    <div class="ctrl-sep"></div>

    <span class="kbd-hint">
      <kbd>Space</kbd> play / pause &nbsp;
      <kbd>&larr;</kbd> <kbd>&rarr;</kbd> step &nbsp;
      <kbd>R</kbd> reset
    </span>

    <span id="frame-counter">frame 0 / 0</span>

    <span id="stat-counter" aria-label="Comparison and write counts"></span>
  </footer>

  <script type="module" src="script.js"></script>
</body>
</html>
