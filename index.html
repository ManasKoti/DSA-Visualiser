<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSA Visualiser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>DSA Visualiser</h1>
    <span id="status-text">Ready.</span>
  </header>

  <main>
    <!-- Single rendering surface. Every algorithm draws here via drawArray() etc. -->
    <canvas id="stage" width="1200" height="600"></canvas>
  </main>

  <footer id="controls">
    <button id="btn-reset" type="button">Reset</button>
    <button id="btn-step-back" type="button">Step Back</button>
    <button id="btn-play" type="button">Play</button>
    <button id="btn-pause" type="button" disabled>Pause</button>
    <button id="btn-step-forward" type="button">Step Forward</button>

    <label class="speed">
      Speed
      <input id="speed" type="range" min="1" max="60" value="6" />
      <span id="speed-value">6 fps</span>
    </label>

    <span id="frame-counter">frame 0 / 0</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
